<!DOCTYPE html><html><head><meta charset="UTF-8"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body>
<canvas id="cv"></canvas><pre id="report">{}</pre>
<script type="module">
import { buildScene, makeRenderer, makeComposer, setSection, setXray, applyExplode } from './js/scene-builder.js';
const p=new URLSearchParams(location.search), scenePath=p.get('scene')||'scene-test-wire.json';
const W=1100,H=700,cv=document.getElementById('cv');cv.width=W;cv.height=H;
const rep={errors:[]}; window.addEventListener('error',e=>rep.errors.push(String(e.message)));
try{
 const spec=await(await fetch(scenePath+'?t='+Date.now())).json();
 const handle=await buildScene(spec);
 const r=makeRenderer(cv,W,H,{preserveDrawingBuffer:true,exposure:spec.environment?.exposure??1.1});
 handle.camera.aspect=W/H;handle.camera.updateProjectionMatrix();
 handle.composer=makeComposer(handle,r,W,H);
 const gl=r.getContext(), px=new Uint8Array(W*H*4);
 function count(){
  (handle.composer?handle.composer.render():r.render(handle.scene,handle.camera));
  gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,px);
  let red=0,green=0,gold=0,bright=0;
  for(let i=0;i<px.length;i+=4){const R=px[i],G=px[i+1],B=px[i+2];
   if(R>110&&R>G*1.6&&R>B*1.6&&G<110)red++;
   if(G>90&&G>R*1.4&&G>B*1.3)green++;
   if(R>140&&G>110&&B<110&&R>B*1.6)gold++;
   if(R+G+B>200)bright++;
  }
  return {red,green,gold,bright};
 }
 const out={};
 out.normal=count();
 setSection(handle,r,{enabled:true,axis:'y',pos:0.10,flip:false,caps:true});out.section_caps=count();
 setSection(handle,r,{enabled:true,axis:'y',pos:0.10,flip:false,caps:false});out.section_nocaps=count();
 setSection(handle,r,{enabled:false,axis:'y',pos:0.10,flip:false,caps:true});
 setXray(handle,true,null);out.xray=count();setXray(handle,false,null);
 applyExplode(handle,0.6);out.explode=count();
 rep.modes=out;rep.ok=true;
}catch(e){rep.errors.push(String(e&&e.stack||e));}
document.getElementById('report').textContent=JSON.stringify(rep);
window.__DONE=true;
</script></body></html>
