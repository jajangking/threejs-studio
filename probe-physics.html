<!DOCTYPE html>
<html><body><pre id="out">{}</pre>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import { buildScene, stepPhysics } from './js/scene-builder.js';
const out = {};
try {
  const spec = await (await fetch('scene.json?t=' + Date.now())).json();
  const handle = await buildScene(spec);
  out.errors = handle.errors;
  out.bodies = [...handle.bodyMap.keys()];
  const snap = () => {
    const s = {};
    for (const id of ['bola', 'domino-0', 'domino-5', 'bar']) {
      const m = handle.registry.get(id);
      if (m) s[id] = { pos: m.position.toArray().map(v => +v.toFixed(3)), rot: [m.rotation.x, m.rotation.y, m.rotation.z].map(v => +v.toFixed(3)) };
    }
    return s;
  };
  out.t0 = snap();
  for (let i = 0; i < 300; i++) stepPhysics(handle, 1 / 60);
  out.t2 = snap();
  out.ok = true;
} catch (e) { out.err = String(e && e.stack || e); }
document.getElementById('out').textContent = JSON.stringify(out);
</script></body></html>
