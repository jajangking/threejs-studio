<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head><body style="margin:0">
<pre id="out"></pre>
<script type="module">
import { buildScene, stepPhysics, makeAudio, updateAudio, audioImpact, audioClick } from './js/scene-builder.js';
const out = document.getElementById('out');
try {
  const spec = {
    meta: { name: 'probe-audio' },
    physics: { gravity: [0, -9.81, 0] },
    environment: { ground: { size: 20, color: '#3a3f4a' } },
    audio: { hum: { object: 'motor', baseFreq: 70, gain: 0.12 } },
    objects: [
      { id: 'motor', type: 'cylinder', position: [0, 1, 0], params: { radiusTop: 0.5, radiusBottom: 0.5, height: 1 }, material: { color: '#2b2f38' } },
      { id: 'bola', type: 'sphere', position: [0.3, 4, 0], params: { radius: 0.3 }, material: { color: '#c0392b' }, physics: { body: 'dynamic', restitution: 0.5 } }
    ],
    lights: [{ type: 'ambient', intensity: 0.6 }]
  };
  const handle = await buildScene(spec);
  const a = makeAudio(handle);
  await a.ctx.resume();
  const res = { ctxState: a.ctx.state, hasHum: !!a.humOsc, hasQueue: !!a.eventQueue };
  updateAudio(handle, false, 1);
  await new Promise(r => setTimeout(r, 300));
  res.gainPowerOff = +a.humGain.gain.value.toFixed(3);
  updateAudio(handle, true, 1.5);
  await new Promise(r => setTimeout(r, 500));
  res.gainPowerOn = +a.humGain.gain.value.toFixed(3);
  res.freqSpeed15 = +a.humOsc.frequency.value.toFixed(1);
  for (let i = 0; i < 120; i++) { stepPhysics(handle, 1 / 60); updateAudio(handle, true, 1); }
  res.impactsFromCollisions = a.impactCount;
  res.rawCollisionEvents = a.collisionEvents || 0;
  res.ballY = +handle.bodyMap.get('bola').translation().y.toFixed(2);
  audioImpact(handle, { x: 0, y: 1, z: 0 }, 5);
  audioClick(handle);
  res.impactsAfterManual = a.impactCount;
  res.listenerPos = a.ctx.listener.positionX ? [a.ctx.listener.positionX.value, a.ctx.listener.positionY.value].map(v => +v.toFixed(1)) : 'legacy';
  out.textContent = JSON.stringify(res);
} catch (e) { out.textContent = JSON.stringify({ error: String(e), stack: e.stack }); }
</script></body></html>
