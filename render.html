<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>headless-render</title>
<style>body{margin:0;background:#000}#shot{display:none}</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<canvas id="cv"></canvas>
<img id="shot" alt="">
<img id="shotDetail" alt="">
<pre id="report">{}</pre>
<script type="module">
import { buildScene, loadExtensions, makeRenderer, makeComposer, smokeCheck, applyAnimations, stepPhysics, applyExplode, compileCameraPath, sampleCameraPath } from './js/scene-builder.js';

const params = new URLSearchParams(location.search);
const scenePath = params.get('scene') || 'scene.json';
const W = parseInt(params.get('w') || '1280'), H = parseInt(params.get('h') || '720');
const cv = document.getElementById('cv');
cv.width = W; cv.height = H;

const report = { ok: false, errors: [] };
window.addEventListener('error', e => report.errors.push(String(e.message)));

try {
  const spec = await (await fetch(scenePath + '?t=' + Date.now())).json();
  const handle = await buildScene(spec, { extensions: await loadExtensions(spec) });
  const urlT = parseFloat(new URLSearchParams(location.search).get('t') || '');
  const cinePath = compileCameraPath(handle);
  if (cinePath && !isNaN(urlT)) {
    const sm = sampleCameraPath(handle, cinePath, urlT);
    if (sm) {
      handle.camera.position.copy(sm.pos); handle.camera.lookAt(sm.target);
      handle.camera.fov = sm.fov; handle.camera.updateProjectionMatrix();
      if (sm.explode !== null) applyExplode(handle, sm.explode);
    }
  }
  const exParam = parseFloat(params.get('explode') || '');
  if (!isNaN(exParam) && exParam > 0) {
    applyExplode(handle, exParam);
    // Kamera tegak lurus sumbu exploded — kalau tidak, komponen hanya bergeser
    // mendekat/menjauh kamera dan tampak menumpuk (vision gate mengira tidak ada bedah).
    const axis = spec.assembly?.axis || 'z';
    const focus = params.get('focus') || '';
    if (focus === 'module') {
      if (axis === 'z') handle.camera.position.set(2.6, 1.7, 2.0);
      else if (axis === 'x') handle.camera.position.set(2.0, 1.7, 2.6);
      else handle.camera.position.set(2.4, 3.4, 2.4);
      handle.camera.lookAt(0, 1.0, 0);  // closeup modul internal
    } else {
      if (axis === 'z') handle.camera.position.set(7.5, 3.4, 4.5);
      else if (axis === 'x') handle.camera.position.set(4.5, 3.4, 7.5);
      else handle.camera.position.set(7, 8.5, 7);
      handle.camera.lookAt(0, 2, 0);    // keseluruhan produk
    }
    handle.scene.traverse(o => { if (o.isLight) o.intensity *= 1.5; });
  }
  const renderer = makeRenderer(cv, W, H, { preserveDrawingBuffer: true, exposure: (!isNaN(exParam) && exParam > 0) ? 1.9 : (spec.environment?.exposure ?? 1.1) });
  handle.camera.aspect = W / H;
  handle.camera.updateProjectionMatrix();
  handle.composer = makeComposer(handle, renderer, W, H);
  applyAnimations(handle, 2.0, true);  // pose mekanika deterministik untuk screenshot
  if (handle.physicsWorld) for (let i = 0; i < 300; i++) stepPhysics(handle, 1 / 60);  // simulasi fisika 5s (domino sempat jatuh)
  const smoke = smokeCheck(handle, renderer, { cinematic: cinePath && !isNaN(urlT) });
  // beberapa frame ekstra agar shadow map & material stabil
  for (let i = 0; i < 3; i++) handle.composer ? handle.composer.render() : renderer.render(handle.scene, handle.camera);
  document.getElementById('shot').src = cv.toDataURL('image/png');
  if (params.get('focus') === 'both' && !isNaN(exParam) && exParam > 0) {
    const ax = spec.assembly?.axis || 'z';
    if (ax === 'z') handle.camera.position.set(2.6, 1.7, 2.0);
    else if (ax === 'x') handle.camera.position.set(2.0, 1.7, 2.6);
    else handle.camera.position.set(2.4, 3.4, 2.4);
    handle.camera.lookAt(0, 1.0, 0);
    handle.camera.updateProjectionMatrix();
    for (let i = 0; i < 3; i++) handle.composer ? handle.composer.render() : renderer.render(handle.scene, handle.camera);
    document.getElementById('shotDetail').src = cv.toDataURL('image/png');
  }
  Object.assign(report, { ok: true, specName: spec.meta?.name, smoke });
} catch (e) {
  report.errors.push(String(e && e.stack || e));
}
document.getElementById('report').textContent = JSON.stringify(report);
window.__RENDER_DONE = true;
</script>
</body>
</html>
