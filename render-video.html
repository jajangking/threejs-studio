<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head><body style="margin:0;background:#000">
<canvas id="cv"></canvas>
<pre id="prog" style="color:#8b91a0;font:12px monospace;position:fixed;top:4px;left:4px"></pre>
<script type="module">
import * as THREE from 'three';
import { buildScene, makeRenderer, makeComposer, applyAnimations, stepPhysics, applyExplode, compileCameraPath, sampleCameraPath, updateDOF } from './js/scene-builder.js';
const q = new URLSearchParams(location.search);
const job = q.get('job') || 'test';
const fps = Math.max(6, Math.min(30, parseInt(q.get('fps') || '24')));
const W = parseInt(q.get('w') || '960'), H = parseInt(q.get('h') || '540');
const prog = document.getElementById('prog');
const cv = document.getElementById('cv');
cv.width = W; cv.height = H;
const blend = document.createElement('canvas');
blend.width = W; blend.height = H;
const bctx = blend.getContext('2d');
try {
  const spec = await (await fetch('./scene.json?t=' + Date.now())).json();
  const handle = await buildScene(spec);
  const renderer = makeRenderer(cv, W, H, { preserveDrawingBuffer: true });
  const composer = makeComposer(handle, renderer, W, H);
  const path = compileCameraPath(handle);
  function applyPose(t) {
  if (path) {
    const sm = sampleCameraPath(handle, path, t);
    if (sm) {
      handle.camera.position.copy(sm.pos); handle.camera.lookAt(sm.target);
      handle.camera.fov = sm.fov; handle.camera.updateProjectionMatrix();
      if (sm.explode !== null) applyExplode(handle, sm.explode);
    }
  } else {
    const a = t * 0.3;
    handle.camera.position.set(Math.cos(a) * 10, 5, Math.sin(a) * 10);
    handle.camera.lookAt(0, 2.5, 0);
  }
}
function renderFrame() {
  if (handle.composer) handle.composer.render(); else renderer.render(handle.scene, handle.camera);
}
function finalize(src, effects, frame) {
  const fx = effects || [];
  const has = n => fx.some(e => e.type === n);
  bctx.globalAlpha = 1; bctx.globalCompositeOperation = 'source-over'; bctx.filter = 'none';
  bctx.clearRect(0, 0, W, H);
  // motion blur: frame sebelumnya jadi lapisan bawah
  if (has('motionBlur') && window.__prevFrame) {
    bctx.drawImage(window.__prevFrame, 0, 0, W, H);
    bctx.globalAlpha = 0.55;
  }
  const grade = fx.find(e => e.type === 'colorGrade');
  const FILTERS = {
    clean: 'contrast(1.08) saturate(1.05) brightness(1.03)',
    teal: 'contrast(1.16) saturate(1.25) sepia(0.12) hue-rotate(165deg)',
    noir: 'grayscale(1) contrast(1.35) brightness(0.92)',
    warm: 'sepia(0.22) saturate(1.18) contrast(1.08)',
  };
  if (grade && FILTERS[grade.look]) bctx.filter = FILTERS[grade.look];
  bctx.drawImage(src, 0, 0, W, H);
  bctx.filter = 'none'; bctx.globalAlpha = 1;
  // glitch: potongan horizontal tergeser (seed dari nomor frame → deterministik)
  const gl = fx.find(e => e.type === 'glitch');
  if (gl) {
    let seed = (frame + 1) * 9301 + 49297;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    for (let k = 0; k < (gl.slices || 4); k++) {
      const y = Math.floor(rnd() * H), h = 4 + Math.floor(rnd() * 14), dx = Math.floor((rnd() - 0.5) * (gl.amount || 22));
      bctx.drawImage(blend, 0, y, W, h, dx, y, W, h);
    }
  }
  // vignette
  if (has('vignette')) {
    const g = bctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.72);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.58)');
    bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);
  }
  // letterbox
  const lb = fx.find(e => e.type === 'letterbox');
  if (lb) { const bh = Math.floor(H * (lb.ratio || 0.09)); bctx.fillStyle = '#000'; bctx.fillRect(0, 0, W, bh); bctx.fillRect(0, H - bh, W, bh); }
  // simpan frame untuk motion blur berikutnya
  if (!window.__prevFrame) { window.__prevFrame = document.createElement('canvas'); window.__prevFrame.width = W; window.__prevFrame.height = H; }
  window.__prevFrame.getContext('2d').drawImage(blend, 0, 0);
  return blend.toDataURL('image/jpeg', 0.85);
}
  handle.dof = spec.cameraPath?.dof?.enabled ? spec.cameraPath.dof : null;
  if (handle.dof) handle.composer = makeComposer(handle, renderer, W, H);
  const dur = parseFloat(q.get('duration') || '') || (path ? path.dur : 10);
  const total = Math.ceil(dur * fps);
  let animT = 0;
  for (let i = 0; i < total; i++) {
    const t = i / fps;
    // animasi & fisika sekuensial deterministik
    animT = t;
    updateDOF(handle);
    applyAnimations(handle, animT, spec.power?.default ?? true);
    if (handle.physicsWorld) {
      const steps = Math.max(1, Math.round(60 / fps));
      for (let s = 0; s < steps; s++) stepPhysics(handle, 1 / 60);
    }
    // Transisi di awal shot: fade (dari hitam), dissolve, wipe
    let tr = null;
    const shots = path?.shots || [];
    const sh = shots.find(s => t >= s.t0 && t < s.t0 + s.dur);
    if (sh?.transition && t < sh.t0 + (sh.transitionDuration || 0.6)) {
      const u = Math.min(1, Math.max(0, (t - sh.t0) / (sh.transitionDuration || 0.6)));
      tr = { type: sh.transition, u, i: sh.i, t0: sh.t0 };
    }
    if (tr) {
      // frame A = ujung shot sebelumnya
      applyPose(Math.max(0, tr.t0 - 0.03)); renderFrame();
      bctx.globalAlpha = 1; bctx.clearRect(0, 0, W, H); bctx.drawImage(cv, 0, 0, W, H);
      // frame B = pose saat ini
      applyPose(t); renderFrame();
      bctx.globalAlpha = tr.type === 'wipe' ? 1 : tr.u;
      if (tr.type === 'wipe') bctx.save(), bctx.beginPath(), bctx.rect(0, 0, W * tr.u, H), bctx.clip();
      if (tr.type !== 'fade') bctx.drawImage(cv, 0, 0, W, H);
      if (tr.type === 'wipe') bctx.restore();
      if (tr.type === 'fade') { bctx.fillStyle = '#000'; bctx.globalAlpha = 1 - tr.u; bctx.fillRect(0, 0, W, H); }
      bctx.globalAlpha = 1;
      var data = finalize(blend, (sh?.effects || path?.effects || []), i);
    } else {
      applyPose(t); renderFrame();
      var data = finalize(cv, (sh?.effects || path?.effects || []), i);
    }
    await fetch('/api/video/frame', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ job, i, data }) });
    if (i % 10 === 0) prog.textContent = `frame ${i}/${total}`;
  }
  await fetch('/api/video/done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ job, frames: total, fps, w: W, h: H }) });
  prog.textContent = `SELESAI ${total} frame — encoding di server`;
  document.title = 'VIDEO_DONE';
} catch (e) {
  prog.textContent = 'ERROR: ' + e.message;
  await fetch('/api/video/done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ job, error: String(e.message || e) }) });
  document.title = 'VIDEO_ERROR';
}
</script></body></html>
