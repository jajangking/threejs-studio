<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Rekaman — Three.js</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<style>
:root{--bg:#0d1017;--panel:#16181d;--panel2:#1e2128;--border:#2e333d;--text:#cfd3dc;--dim:#8b91a0;--accent:#4f8cff;--good:#3fb96b;--bad:#e5534b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,sans-serif}
#topbar{height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--border)}
#topbar .logo{font-weight:700;color:var(--accent);letter-spacing:.5px}
#sceneName{color:var(--dim);font-size:12px}
#topbar .spacer{flex:1}
#topbar a,#topbar button{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;text-decoration:none}
#topbar a:hover,#topbar button:hover{border-color:var(--accent)}
#topbar button.primary{border-color:var(--accent);color:var(--accent)}
#stage{position:relative;height:calc(100% - 44px)}
canvas{display:block;width:100%;height:100%}
#vpCine{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;background:rgba(22,24,29,.92);border:1px solid var(--border);border-radius:8px;padding:5px 10px;z-index:6;font-size:11px;max-width:72%;flex-wrap:wrap;justify-content:center}
#vpCine:empty{display:none}
#vpCine button{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:3px 9px;cursor:pointer;font-size:11px}
#vpCine button.on{border-color:var(--accent);color:var(--accent)}
.cine-chip.on{border-color:var(--good)!important;color:#7ee2a8!important}
.cine-info{color:var(--dim);font-family:ui-monospace,monospace;font-size:10px}
#cineCaption{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);background:rgba(10,12,16,.85);border:1px solid var(--border);color:#e8eaef;padding:7px 18px;border-radius:8px;font-size:13px;z-index:6;display:none;max-width:70%;text-align:center}
#vpTimeline{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(22,24,29,.9);border:1px solid var(--border);border-radius:8px;padding:5px 12px;z-index:5;font-size:11px}
#vpTimeline:empty{display:none}
#vpTimeline button{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:2px 9px;cursor:pointer;font-size:12px}
#tlTime{font-family:ui-monospace,monospace;color:var(--dim);width:38px;text-align:right}
#vpTimeline input[type=range]{width:220px;accent-color:var(--accent)}
#vpControls{position:absolute;bottom:10px;right:10px;display:flex;gap:6px;z-index:5}
.vp-ctl{background:rgba(22,24,29,.9);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 11px;font-size:11.5px;cursor:pointer}
.vp-ctl:hover{border-color:var(--accent)}
.vp-ctl.on{border-color:var(--good);color:#7ee2a8}
#shotPanel{position:absolute;top:10px;left:10px;background:rgba(22,24,29,.92);border:1px solid var(--border);border-radius:8px;padding:10px 12px;z-index:6;font-size:11px;max-width:250px}
#shotPanel:empty{display:none}
#shotPanel h3{font-size:11px;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.shot-row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid rgba(46,51,61,.5);cursor:pointer}
.shot-row:hover{color:var(--accent)}
.shot-row .m{color:var(--dim);font-family:ui-monospace,monospace;font-size:10px}
#videoProgress{position:fixed;top:52px;left:50%;transform:translateX(-50%);background:rgba(22,24,29,.95);border:1px solid var(--accent);color:var(--text);padding:8px 16px;border-radius:8px;z-index:99;font-size:12px;display:none}
#videoProgress a{color:var(--accent)}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(22,24,29,.95);border:1px solid var(--border);color:var(--text);padding:7px 16px;border-radius:8px;z-index:100;font-size:12px;display:none}
#hint{position:absolute;bottom:10px;left:10px;color:#6b7280;font-size:10px;z-index:4}
</style>
</head>
<body>
<div id="topbar">
  <span class="logo">🎬 STUDIO REKAMAN</span>
  <span id="sceneName">memuat…</span>
  <span class="spacer"></span>
  <button id="btnVideo" class="primary" title="Render tur sinematik → MP4 (ffmpeg)">🎬 Video MP4</button>
  <button id="btnExportHtml" title="HTML interaktif: klik aksi, shift-drag fisika, mode jalan">🌐 Export Interaktif</button>
  <a href="/" title="Kembali ke Studio Design">🎨 Design</a>
</div>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="shotPanel"></div>
  <div id="vpCine"></div>
  <div id="cineCaption"></div>
  <div id="vpTimeline"></div>
  <div id="vpControls"></div>
  <div id="hint">Klik objek = aksi · Shift+drag = angkat fisika · 🚶 WASD jalan · kamera mengikuti tur</div>
</div>
<div id="videoProgress"></div>
<div id="toast"></div>
<script type="module" src="./js/rekaman.js"></script>
</body>
</html>
